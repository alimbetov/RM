name: RM Exact-SHA Qualification Admission

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - RM Domain Security and PostgreSQL Qualification
      - CRM R1.2 Populated PostgreSQL Upgrade Qualification
      - INVENTORY 0081 Populated PostgreSQL Upgrade Qualification
      - SALES 08.4 Populated PostgreSQL Upgrade Qualification
      - RustFS Real Infrastructure E2E
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  exact-sha-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Aggregate mandatory results for the current base_dev SHA
        id: qualify
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'base_dev';
            const {data: branchData} = await github.rest.repos.getBranch({owner,repo,branch});
            const sha = branchData.commit.sha;
            // A completed stale workflow_run must never approve a newer candidate.
            if (context.eventName === 'workflow_run' &&
                (context.payload.workflow_run.head_sha !== sha ||
                 context.payload.workflow_run.head_branch !== branch)) {
              core.notice('Stale SHA event; current head is ' + sha);
              return;
            }
            const required = [
              'RM Domain Security and PostgreSQL Qualification',
              'CRM R1.2 Populated PostgreSQL Upgrade Qualification',
              'INVENTORY 0081 Populated PostgreSQL Upgrade Qualification',
              'SALES 08.4 Populated PostgreSQL Upgrade Qualification',
              'RustFS Real Infrastructure E2E'
            ];
            const results = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{
              owner,repo,head_sha:sha,branch,per_page:100
            });
            const manifest = {
              schema:'RM-QA-01B/v1',repository:owner+'/'+repo,branch,sha,
              observed_at:new Date().toISOString(),required:[]
            };
            let allGreen=true;
            for(const name of required) {
              const matching = results.filter(r=>r.name===name && r.head_sha===sha &&
                r.event==='push').sort((a,b)=>b.id-a.id);
              const run=matching[0];
              const record = run ? {
                name,id:run.id,sha:run.head_sha,status:run.status,
                conclusion:run.conclusion,url:run.html_url,run_attempt:run.run_attempt
              } : {name,status:'MISSING',conclusion:null};
              // Require at least one completed, successful run for EACH
              // mandatory pipeline. A queued or skipped run never qualifies.
              if(!run || run.status!=='completed' || run.conclusion!=='success')
                allGreen=false;
              manifest.required.push(record);
            }
            manifest.admission = allGreen?'QUALIFIED':'HOLD';
            fs.writeFileSync('rm-exact-sha-manifest.json',
              JSON.stringify(manifest,null,2)+'\n');
            core.info(JSON.stringify(manifest,null,2));
            if(!allGreen)
              core.setFailed('RM-QA-01B HOLD: incomplete or failed mandatory exact-SHA evidence');
      - name: Publish immutable manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm-exact-sha-qualification-manifest
          path: rm-exact-sha-manifest.json
          if-no-files-found: warn
