name: RM IAM Seller R0 Authenticated Tenant Service Admission PostgreSQL

on:
  push:
    branches: [base_dev]
    paths:
      - 'src/main/java/kz/rm/iam/OidcJwtConfiguration.java'
      - 'src/main/java/kz/rm/iam/OidcActorResolver.java'
      - 'src/main/java/kz/rm/iam/VerifiedActor.java'
      - 'src/main/java/kz/rm/iam/TenantAuthorization.java'
      - 'src/main/java/kz/rm/iam/SelfServiceTenantOnboardingService.java'
      - 'src/main/java/kz/rm/iam/MyAccessService.java'
      - 'src/main/java/kz/rm/catalog/CatalogItemService.java'
      - 'src/test/java/kz/rm/iam/IamSellerAuthenticatedTenantAdmissionQualificationTest.java'
      - 'src/test/java/kz/rm/iam/OidcJwtCryptoQualificationTest.java'
      - 'src/test/java/kz/rm/iam/R4LocalJwksIntegrationQualificationTest.java'
      - '.github/scripts/verify_rm_qa_01b.py'
      - 'docs/reviews/RM-IAM-SELLER-R0-AUTHENTICATED-TENANT-ADMISSION-2026-11-24.md'
      - '.github/workflows/rm-iam-seller-r0-postgresql.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signed-jwt-tenant-service:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Require exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Signed access tokens, JWKS and IAM–seller service admission
        run: >-
          mvn -B -ntp clean test
          '-Dtest=IamSellerAuthenticatedTenantAdmissionQualificationTest,OidcJwtCryptoQualificationTest,R4LocalJwksIntegrationQualificationTest'
      - name: Require six PostgreSQL IAM–SELLER-R0 methods without skips
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          expected = {
              'iamSellerR0RealBearerSubCannotBeOverriddenByActorOrTenantClaims',
              'iamSellerR0SignedIdRefreshWrongPurposeAndBadJwtNeverMintActor',
              'iamSellerR0RoleRevokedAfterSignedTokenAndTenantSelectionDeniesWrite',
              'iamSellerR0MembershipSuspendedAfterBearerBlocksSelectAndMutation',
              'iamSellerR0SuspendedAccountRejectsExistingAndFreshBearer',
              'iamSellerR0TenantSuspendedAfterAccessTokenDeniesCurrentSelectionAndWrite',
          }
          files=list(Path('target/surefire-reports').glob('TEST-*.xml'))
          assert files, 'IAM_SELLER_R0_MISSING_SUREFIRE'
          rows=[tc for path in files for tc in ET.parse(path).getroot().iter('testcase')]
          matches={row.attrib.get('name'):row for row in rows if row.attrib.get('name') in expected}
          assert expected <= matches.keys(), 'IAM_SELLER_R0_MISSING_CASES '+str(expected-matches.keys())
          for method,row in matches.items():
              assert not any(row.find(t) is not None for t in ('failure','error','skipped')), (
                  'IAM_SELLER_R0_FAILED_OR_SKIPPED '+method)
          print('IAM_SELLER_R0_6_OF_6_SIGNED_JWT_PG_EXECUTED')
          PY
      - name: Persist signed-JWT PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm-iam-seller-r0-pg-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: warn
