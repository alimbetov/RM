name: CRM-R2.1B Isolated Exact-SHA PostgreSQL Qualification
on:
  push:
    branches: [base_dev]
    paths:
      - '.github/workflows/crm-r21b-exact-sha.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full 40-character commit SHA (blank uses trigger SHA)'
        required: false
        type: string
# No concurrency cancellation: one run never supersedes evidence for another SHA.
permissions:
  contents: read
jobs:
  crm-r21b-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      REQUESTED_SHA: '${{ inputs.target_sha || github.sha }}'
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@v4
        with:
          ref: '${{ env.REQUESTED_SHA }}'
          fetch-depth: 0
      - name: Verify source SHA and branch provenance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch origin base_dev
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/base_dev
          printf 'sha=%s\nworkflow=%s\nrun_id=%s\n' "$REQUESTED_SHA" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" > crm-r21b-provenance.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: PostgreSQL full CRM service suite
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=CrmR1aQualificationTest,CrmInteractionQualificationTest test
          mkdir -p crm-r21b-evidence/full
          cp target/surefire-reports/TEST-*.xml crm-r21b-evidence/full/
      - name: Re-run four PostgreSQL races three times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            mvn -B -ntp '-Dtest=CrmInteractionQualificationTest#crmR21bPostgres*' test
            mkdir -p "crm-r21b-evidence/race-$attempt"
            cp target/surefire-reports/TEST-kz.rm.crm.CrmInteractionQualificationTest.xml "crm-r21b-evidence/race-$attempt/"
          done
      - name: Validate Surefire counts, coverage and no skips
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys,xml.etree.ElementTree as ET
          expected={
            'crmR21bPostgresConcurrentCompleteAndCancelAreSingleWinner',
            'crmR21bPostgresConcurrentArchiveAndRecordFenceNewActivity',
            'crmR21bPostgresAssignmentCommitsBeforeTrustedSuspension',
            'crmR21bPostgresTrustedSuspensionCommitsBeforeAssignment'}
          root=pathlib.Path('crm-r21b-evidence')
          result={'sha':os.environ['REQUESTED_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'suites':{},'status':'FAIL'}
          errors=[]
          for section in ('full','race-1','race-2','race-3'):
            files=list((root/section).glob('TEST-*.xml'))
            if not files:
              errors.append(section+': missing XML'); continue
            cases=[t for f in files for t in ET.parse(f).getroot().iter('testcase')]
            names={t.get('name') for t in cases}
            missing=sorted(expected-names)
            skipped=sum(t.find('skipped') is not None for t in cases)
            failed=sum(t.find('failure') is not None or t.find('error') is not None for t in cases)
            result['suites'][section]={'executed':len(cases),'failed':failed,'skipped':skipped,'race_names':sorted(names & expected)}
            if missing or skipped or failed: errors.append(f'{section}: missing={missing}, failed={failed}, skipped={skipped}')
          result['errors']=errors
          if not errors: result['status']='PASS'
          root.mkdir(exist_ok=True)
          (root/'manifest.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          if errors: sys.exit(1)
          PY
      - name: Upload exact-SHA CRM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-r21b-postgresql-evidence-${{ github.run_id }}
          path: |
            crm-r21b-provenance.txt
            crm-r21b-evidence/
            target/surefire-reports/
          if-no-files-found: warn
