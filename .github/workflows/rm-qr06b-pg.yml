name: RM QR-06B PostgreSQL Handover Race Qualification

on:
  push:
    branches: [base_dev]
    paths:
      - 'src/main/java/kz/rm/sales/**'
      - 'src/main/java/kz/rm/iam/**'
      - 'src/main/java/kz/rm/inventory/**'
      - 'src/test/java/kz/rm/sales/QrWarehouseHandoverQualificationTest.java'
      - 'src/test/java/kz/rm/sales/QrHandoverProcessWorker.java'
      - 'src/test/java/kz/rm/iam/TenantRbacRevocationQualificationTest.java'
      - 'src/main/resources/db/changelog/**'
      - '.github/workflows/rm-qr06b-pg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qr06b-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact candidate SHA
        run: |
          echo "QR06B_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Qualify handover and IAM revocation on real PostgreSQL
        env:
          SPRING_PROFILES_ACTIVE: test
          RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
          RM_TEST_DB_USERNAME: rm
          RM_TEST_DB_PASSWORD: rm_ci_only
          RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
        run: |
          mvn -B -ntp dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile=target/qr06b-classpath.txt
          export RM_QR06B_JAVA_CLASSPATH="$PWD/target/test-classes:$PWD/target/classes:$(cat target/qr06b-classpath.txt)"
          mvn -B -ntp -Dtest=QrWarehouseHandoverQualificationTest,TenantRbacRevocationQualificationTest test
      - name: Upload qualified evidence tied to commit SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr06b-postgres-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: error

  qr06b-b31-mixed-load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify B3.1 exact source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Repeated 100/250 multi-order and mixed inventory workload
        env:
          SPRING_PROFILES_ACTIVE: test
          RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
          RM_TEST_DB_USERNAME: rm
          RM_TEST_DB_PASSWORD: rm_ci_only
          RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
        run: |
          mkdir -p target/qr06b-evidence
          set -o pipefail
          mvn -B -ntp dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile=target/qr06b-classpath.txt
          export RM_QR06B_JAVA_CLASSPATH="$PWD/target/test-classes:$PWD/target/classes:$(cat target/qr06b-classpath.txt)"
          mvn -B -ntp '-Dtest=QrWarehouseHandoverQualificationTest#qr06bPgB31*' test 2>&1 | tee target/qr06b-evidence/load.log
          grep 'QR06B_B31_' target/qr06b-evidence/load.log > target/qr06b-evidence/measurements.txt
          printf '%s\n' "${GITHUB_SHA}" > target/qr06b-evidence/exact-sha.txt
      - name: Preserve test and measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr06b-b31-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/qr06b-evidence/
          if-no-files-found: error

  qr06b-b32-success-throughput:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify B3.2 exact source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Profile independent successful orders and mixed stock operations
        env:
          SPRING_PROFILES_ACTIVE: test
          RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
          RM_TEST_DB_USERNAME: rm
          RM_TEST_DB_PASSWORD: rm_ci_only
          RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
        run: |
          mkdir -p target/qr06b-b32-evidence
          set -o pipefail
          mvn -B -ntp '-Dtest=QrWarehouseHandoverQualificationTest#qr06bPgB32*' test 2>&1 | tee target/qr06b-b32-evidence/console.log
          grep '^QR06B_B32' target/qr06b-b32-evidence/console.log > target/qr06b-b32-evidence/metrics.txt
          printf '%s\n' "${GITHUB_SHA}" > target/qr06b-b32-evidence/exact-sha.txt
      - name: Upload B3.2 SQL and latency qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr06b-b32-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/qr06b-b32-evidence/
          if-no-files-found: error
