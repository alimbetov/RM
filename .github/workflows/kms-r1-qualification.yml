name: RM KMS R1.6 Qualification

on:
  push:
    branches:
      - feat/rm-kms-r1-implementation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven test (H2 / dev profile)
        env:
          SPRING_PROFILES_ACTIVE: dev
        run: mvn -B -ntp clean verify
      - name: Upload H2 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kms-h2-surefire
          path: target/surefire-reports/
          if-no-files-found: warn

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven test (isolated PostgreSQL / test profile)
        env:
          SPRING_PROFILES_ACTIVE: test
          RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
          RM_TEST_DB_USERNAME: rm
          RM_TEST_DB_PASSWORD: rm_ci_only
        run: mvn -B -ntp clean verify
      - name: Upload PostgreSQL test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kms-postgres-surefire
          path: target/surefire-reports/
          if-no-files-found: warn
