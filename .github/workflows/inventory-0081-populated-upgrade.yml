name: INVENTORY 0081 Populated PostgreSQL Upgrade Qualification

on:
  push:
    branches: [base_dev]
    paths:
      - 'src/main/java/kz/rm/inventory/**'
      - 'src/main/resources/db/changelog/**'
      - 'src/test/java/kz/rm/inventory/**'
      - 'src/test/java/kz/rm/integration/**'
      - '.github/workflows/inventory-0081-populated-upgrade.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inventory-0081-populated-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
    steps:
      - name: Checkout pre-0081 qualified foundation
        uses: actions/checkout@v4
        with:
          ref: 2f6ff5259bb52756268ffaa19e093fb155bd75a1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Populate immutable stock movements before migration
        run: mvn -B -ntp -Dtest=InventoryMovementQualificationTest#adjustmentIsAtomicAndIdempotent test
      - name: Snapshot pre-existing movement identity and quantity evidence
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -F '|' \
            -c "SELECT tenant_id,id,location_id,item_id,delta_quantity,balance_before,balance_after FROM crm.inv_stock_movement ORDER BY tenant_id,id" > /tmp/movements-before.txt
          test -s /tmp/movements-before.txt
          docker exec "$PG_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -F '|' \
            -c "SELECT tenant_id,location_id,item_id,on_hand,reserved,row_version FROM crm.inv_stock_balance ORDER BY tenant_id,location_id,item_id" > /tmp/balances-before.txt
      - name: Checkout current SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
      - name: Upgrade populated PostgreSQL and qualify movement contract
        run: mvn -B -ntp -Dtest=InventoryMovementQualificationTest,InventoryTransferStocktakeQualificationTest#postgresW2ConcurrentReceiveTransferAndReconciliationAcrossTwoPositions,CommercialCoreE2EQualificationTest#postgresW2ReserveFulfillAndReconciliationNeverObservePartialLedger test
      - name: Verify legacy rows retained and explicitly unverified
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -F '|' \
            -c "SELECT tenant_id,id,location_id,item_id,delta_quantity,balance_before,balance_after FROM crm.inv_stock_movement WHERE posting_version IS NULL ORDER BY tenant_id,id" > /tmp/movements-after.txt
          diff -u /tmp/movements-before.txt /tmp/movements-after.txt
          docker exec "$PG_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -F '|' \
            -c "SELECT tenant_id,location_id,item_id,on_hand,reserved,row_version FROM crm.inv_stock_balance WHERE (tenant_id,location_id,item_id) IN (SELECT tenant_id,location_id,item_id FROM crm.inv_stock_movement WHERE posting_version IS NULL) ORDER BY tenant_id,location_id,item_id" > /tmp/balances-after-legacy.txt
          diff -u /tmp/balances-before.txt /tmp/balances-after-legacy.txt
          docker exec -i "$PG_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U rm -d rm_test <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns
              WHERE table_schema='crm' AND table_name='inv_stock_movement'
              AND column_name='posting_version') THEN
              RAISE EXCEPTION 'Liquibase 0081 missing posting_version';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM crm.inv_stock_movement
              WHERE posting_version IS NULL) THEN
              RAISE EXCEPTION 'Pre-existing immutable movements not retained';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM crm.inv_stock_movement
              WHERE posting_version IS NOT NULL) THEN
              RAISE EXCEPTION 'No new versioned stock movement';
            END IF;
          END $$;
          SQL
      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-0081-populated-postgresql
          path: target/surefire-reports/
          if-no-files-found: error
