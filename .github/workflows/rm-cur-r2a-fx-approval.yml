name: RM CUR-R2A/R2B Seller FX Approval Qualification
on:
  push:
    branches: [base_dev]
    paths:
      - 'src/main/java/kz/rm/fx/SkuFxSellerApprovalService.java'
      - 'src/main/java/kz/rm/fx/NbrkTradingCalendarPolicy.java'
      - 'src/main/java/kz/rm/fx/FxCalendarEvidenceService.java'
      - 'src/main/java/kz/rm/fx/TrustedKaseCalendarHttpClient.java'
      - 'src/test/java/kz/rm/fx/TrustedKaseCalendarHttpClientTest.java'
      - 'src/test/java/kz/rm/fx/NbrkTradingCalendarPolicyTest.java'
      - 'src/main/java/kz/rm/fx/FxEvaluationClockConfiguration.java'
      - 'src/main/java/kz/rm/fx/SkuFxCandidateCalculator.java'
      - 'src/main/java/kz/rm/fx/NbrkRateSnapshotReader.java'
      - 'src/main/java/kz/rm/storefront/StorefrontOfferService.java'
      - 'src/main/resources/db/changelog/db.changelog-master.sql'
      - 'src/test/java/kz/rm/fx/SkuFxSellerApprovalQualificationTest.java'
      - '.github/workflows/rm-cur-r2a-fx-approval.yml'
      - 'docs/spec/RM-CUR-R2A-IMMUTABLE-SKU-FX-APPROVAL.md'
      - 'docs/spec/RM-CUR-R2B-SELLER-FX-PRICING-GUARDRAILS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cur-r2a-h2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPRING_PROFILES_ACTIVE: dev
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Exact-SHA checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Service-only calculation and approval H2 qualification
        run: mvn -B -ntp -Dtest=SkuFxSellerApprovalQualificationTest,SkuFxCandidateCalculatorTest,NbrkTradingCalendarPolicyTest,TrustedKaseCalendarHttpClientTest test
      - name: Verify test report, count and expected database skip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          for name, expected, skipped in [
              ('SkuFxSellerApprovalQualificationTest',27,8),
              ('SkuFxCandidateCalculatorTest',9,0),
              ('NbrkTradingCalendarPolicyTest',4,0),
              ('TrustedKaseCalendarHttpClientTest',4,0)]:
              p=Path('target/surefire-reports/TEST-kz.rm.fx.'+name+'.xml')
              assert p.is_file(),p
              cases=list(E.parse(p).getroot().iter('testcase'))
              assert len(cases)==expected,(name,len(cases))
              assert sum(c.find('skipped') is not None for c in cases)==skipped,name
              assert not any(c.find(x) is not None for c in cases for x in ('error','failure')),name
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cur-r2a-h2-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: error

  cur-r2a-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Exact-SHA checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: PostgreSQL seller FX evidence and snapshot qualification
        run: mvn -B -ntp -Dtest=SkuFxSellerApprovalQualificationTest,SkuFxCandidateCalculatorTest,NbrkTradingCalendarPolicyTest,TrustedKaseCalendarHttpClientTest test
      - name: Require 44 executed cases without skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          for name, expected in [('SkuFxSellerApprovalQualificationTest',27),
                                 ('SkuFxCandidateCalculatorTest',9),
                                 ('NbrkTradingCalendarPolicyTest',4),
                                 ('TrustedKaseCalendarHttpClientTest',4)]:
              p=Path('target/surefire-reports/TEST-kz.rm.fx.'+name+'.xml')
              assert p.is_file(),p
              cases=list(E.parse(p).getroot().iter('testcase'))
              assert len(cases)==expected,(name,len(cases))
              assert not any(c.find(x) is not None for c in cases
                             for x in ('skipped','error','failure')),name
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cur-r2a-postgresql-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: error
