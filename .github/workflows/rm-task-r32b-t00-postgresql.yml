name: RM TASK R32B T00 PostgreSQL Contract Qualification

on:
  push:
    branches: [base_dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t00-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run real PostgreSQL CRM event / IAM race / rollback contract tests
        run: mvn -B -ntp '-Dtest=CrmInteractionQualificationTest#t00*' test
      - name: Enforce nine T00 cases with no failures or skipped PostgreSQL tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          p=Path('target/surefire-reports/TEST-kz.rm.crm.CrmInteractionQualificationTest.xml')
          assert p.is_file(),p
          cases=list(E.parse(p).getroot().iter('testcase'))
          expected={
            't00CancellationEventHasCanonicalIdentityAndSingleRevision',
            't00OuterTransactionRollbackRemovesCancellationAndSourceEvent',
            't00CancellationIntentPortCannotRunOutsideCrmTransaction',
            't00PgConcurrentCancellationCreatesExactlyOneCanonicalEvent',
            't00PgActorSuspensionCommitsBeforeCancellationDeniesWithoutEvent',
            't00PgCancellationCommitsBeforeActorSuspensionPreservesOneEvent',
            't00PgCanonicalEventIdentityAndPrecisionAreStoredExactly',
            't00PgTransactionPortReceivesPersistedCanonicalEvent',
            't00PgPortFailureRollsBackCancellationAndEvent',
          }
          found={x.get('name') for x in cases}
          assert len(cases)==9 and found==expected,(len(cases),found^expected)
          assert not any(c.find(x) is not None for c in cases
                         for x in ('skipped','failure','error'))
          PY
      - name: Verify persistent canonical source-event invariants
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -c "
            DO \$\$ DECLARE bad bigint;
            BEGIN
              SELECT count(*) INTO bad
              FROM crm.customer_interaction_event e
              JOIN crm.customer_interaction i
                ON i.tenant_id=e.tenant_id AND i.id=e.interaction_id
              WHERE e.action_code='CANCELLED'
                AND (e.new_version<>i.row_version OR i.status<>'CANCELLED');
              IF bad<>0 THEN RAISE EXCEPTION 'inconsistent canonical CRM events: %',bad; END IF;
              IF NOT EXISTS(SELECT 1 FROM crm.customer_interaction_event WHERE action_code='CANCELLED')
                 THEN RAISE EXCEPTION 'no CRM cancellation evidence'; END IF;
            END \$\$;"
      - name: Publish T00 PostgreSQL Surefire evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm-task-t00-postgresql-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: error
