name: RM Currency R1A Tenant Policy Qualification
on:
  push:
    branches: [base_dev]
    paths:
      - 'src/main/java/kz/rm/organization/TenantCurrencyPolicyService.java'
      - 'src/test/java/kz/rm/organization/TenantCurrencyPolicyQualificationTest.java'
      - 'src/main/resources/db/changelog/db.changelog-master.sql'
      - '.github/workflows/rm-currency-r1a-pg.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  currency-h2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRING_PROFILES_ACTIVE: dev
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Qualify tenant currency KZT policy on H2
        run: mvn -B -ntp -Dtest=TenantCurrencyPolicyQualificationTest test
      - name: Validate executed H2 test cases
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          p=pathlib.Path('target/surefire-reports/TEST-kz.rm.organization.TenantCurrencyPolicyQualificationTest.xml')
          assert p.is_file()
          cases=list(ET.parse(p).getroot().iter('testcase'))
          assert len(cases)==5
          assert sum(c.find('skipped') is not None for c in cases)==1
          assert not any(c.find('error') is not None or c.find('failure') is not None for c in cases)
          PY
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: currency-r1a-h2-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: warn

  currency-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Qualify tenant currency policy on PostgreSQL 17
        run: mvn -B -ntp -Dtest=TenantCurrencyPolicyQualificationTest test
      - name: Validate full five-case Surefire XML
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          p=pathlib.Path('target/surefire-reports/TEST-kz.rm.organization.TenantCurrencyPolicyQualificationTest.xml')
          assert p.is_file()
          cases=list(ET.parse(p).getroot().iter('testcase'))
          assert len(cases)==5
          assert not any(c.find(x) is not None for c in cases for x in ('error','failure','skipped'))
          PY
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: currency-r1a-postgresql-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: warn
