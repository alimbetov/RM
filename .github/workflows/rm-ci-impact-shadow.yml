name: RM CI Impact Shadow
on:
  push:
    branches: [base_dev]
permissions:
  contents: read
jobs:
  impact-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify impact classifier
        run: node --test .github/scripts/test_rm_ci_impact_shadow.cjs
      - name: Generate advisory impact report
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/rm_ci_impact_shadow.cjs "$BEFORE" "$HEAD_SHA" rm-ci-impact-shadow.json
      - name: Verify repository fingerprint contracts
        run: node --test .github/scripts/test_rm_ci_fingerprint.cjs
      - name: Generate advisory fingerprint comparison
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/rm_ci_fingerprint.cjs "$BEFORE" "$HEAD_SHA" rm-ci-fingerprint.json
      - name: Verify deterministic execution plan contract
        run: python3 -m unittest discover -s .github/scripts -p 'test_verify_rm_ci_selective_allowlist.py' -v
      - name: Generate shadow execution plan
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 .github/scripts/verify_rm_ci_selective_allowlist.py --plan "$BEFORE" "$HEAD_SHA" --impact rm-ci-impact-shadow.json --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" > rm-ci-execution-plan.json
          cat rm-ci-execution-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: rm-ci-impact-shadow-${{ github.sha }}
          path: |
            rm-ci-impact-shadow.json
            rm-ci-fingerprint.json
            rm-ci-execution-plan.json
          if-no-files-found: error
