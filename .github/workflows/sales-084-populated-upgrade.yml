name: SALES 08.4 Populated PostgreSQL Upgrade Qualification

on:
  push:
    branches: [base_dev]
    # Required for exact-SHA commercial admission on every candidate,
    # including inventory-only changes; never reuse a prior-SHA PASS.
  workflow_dispatch:

# Run qualification for the latest branch revision; do not accumulate stale SHA jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offer-populated-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
    steps:
      - name: Checkout pre-0079 qualified seller foundation
        uses: actions/checkout@v4
        with:
          ref: 711c4c230855591c166965e7f2c1da9758b064d3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Seed populated offers with old accepted catalogue mapping
        run: mvn -B -ntp -Dtest=SellerOfferQualificationTest#draftPublicationPauseResumeAndCas test
      - name: Snapshot offer identity and immutable business fields
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -F '|' \
            -c "SELECT tenant_id,id,catalog_item_id,title,unit_price,currency,state,row_version FROM crm.store_offer ORDER BY tenant_id,id" > /tmp/offers-before.txt
          test -s /tmp/offers-before.txt
      - name: Checkout current code and migrate populated PostgreSQL
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
      - name: Run seller offer tests after Liquibase 0079
        run: mvn -B -ntp -Dtest=SellerOfferQualificationTest test
      - name: Check pre-existing offer data preserved and trigger enforces SKU immutability
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -F '|' \
            -c "SELECT tenant_id,id,catalog_item_id,title,unit_price,currency,state,row_version FROM crm.store_offer ORDER BY tenant_id,id" > /tmp/offers-after.txt
          if comm -23 /tmp/offers-before.txt /tmp/offers-after.txt | grep -q .; then
            echo "Existing offer identity, SKU, price, currency, state or CAS version changed"; exit 1
          fi
          docker exec -i "$PG_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U rm -d rm_test <<'SQL'
          DO $$
          DECLARE t uuid; offer_id uuid; initial_sku uuid;
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname='trg_sales_offer_identity_immutable' AND NOT tgisinternal
            ) THEN RAISE EXCEPTION 'Offer identity trigger missing'; END IF;
            SELECT tenant_id,id,catalog_item_id INTO t,offer_id,initial_sku
              FROM crm.store_offer WHERE catalog_item_id IS NOT NULL LIMIT 1;
            IF offer_id IS NULL THEN RAISE EXCEPTION 'No populated offer fixture'; END IF;
            BEGIN
              UPDATE crm.store_offer SET catalog_item_id=NULL WHERE tenant_id=t AND id=offer_id;
              RAISE EXCEPTION 'Offer SKU change incorrectly accepted';
            EXCEPTION
              WHEN raise_exception THEN
                IF SQLERRM <> 'Offer catalog mapping is immutable' THEN
                  RAISE;
                END IF;
            END;
            IF (SELECT catalog_item_id FROM crm.store_offer WHERE tenant_id=t AND id=offer_id)
                IS DISTINCT FROM initial_sku THEN
              RAISE EXCEPTION 'Offer SKU changed';
            END IF;
          END $$;
          SQL
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-084-populated-postgresql
          path: target/surefire-reports/
          if-no-files-found: warn
