name: RM FX R0 Mock Rate Refresh Qualification
on:
  push:
    branches: [base_dev]
    paths:
      - 'src/main/java/kz/rm/fx/**'
      - 'src/test/java/kz/rm/fx/**'
      - '.github/workflows/rm-fx-r0-mock-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-rate-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run synthetic FX source qualification
        run: mvn -B -ntp -Dtest=FxRateRefreshMockQualificationTest test
      - name: Verify executed cases from Surefire XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path('target/surefire-reports/TEST-kz.rm.fx.FxRateRefreshMockQualificationTest.xml')
          assert p.is_file(), 'Missing FX Surefire XML'
          cases=list(ET.parse(p).getroot().iter('testcase'))
          assert len(cases)==5, f'Unexpected count {len(cases)}'
          assert not any(c.find(tag) is not None for c in cases
                         for tag in ('skipped','failure','error'))
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-r0-mock-${{ github.sha }}
          path: target/surefire-reports/TEST-kz.rm.fx.FxRateRefreshMockQualificationTest.xml
          if-no-files-found: warn
