name: RM Radar R0.1A Exact Timing Qualification
on:
  push:
    branches: [base_dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timing-h2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: H2 exact timing primitives (no fallback)
        run: mvn -B -ntp -Dtest=TaskExactTimingQualificationTest -Drm.radar.expectedDb=h2 test
      - name: Require all twelve named cases without skips
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as E
          from pathlib import Path
          p=Path('target/surefire-reports/TEST-kz.rm.tasks.TaskExactTimingQualificationTest.xml')
          root=E.parse(p).getroot()
          cases=list(root.iter('testcase'))
          assert len(cases)==12
          assert {c.attrib['name'] for c in cases}==set(["q01SignedMicrosecondsAndZero","q02CrossSecondAndEpoch","q03LongSupportedRangeAndNegative","q04OffsetAndDstSpringForward","q05DstFallBackAndElapsedDays","q06NullIsUnknownNotZero","q07CutoffTruncationAndRoundTrip","q08ExactFiftyPercentAndOddPlan","q09CompletionEqualityLateAndInvalidPlan","q10ActiveBoundariesAndSeverity","q11DeterministicRandomOracleParity","q12LongPlanThresholdNoOverflow"])
          assert not any(c.find(x) is not None for c in cases for x in ('failure','error','skipped'))
          assert root.attrib['tests']=='12' and all(root.attrib[k]=='0' for k in ('failures','errors','skipped'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm-radar-r01a-h2-${{ github.sha }}
          path: target/surefire-reports/TEST-kz.rm.tasks.TaskExactTimingQualificationTest.xml
          if-no-files-found: error
  timing-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: PostgreSQL 17 exact timing primitives (no fallback)
        run: mvn -B -ntp -Dtest=TaskExactTimingQualificationTest -Drm.radar.expectedDb=postgresql test
      - name: Require all twelve named cases without skips
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as E
          from pathlib import Path
          p=Path('target/surefire-reports/TEST-kz.rm.tasks.TaskExactTimingQualificationTest.xml')
          root=E.parse(p).getroot()
          cases=list(root.iter('testcase'))
          assert len(cases)==12
          assert {c.attrib['name'] for c in cases}==set(["q01SignedMicrosecondsAndZero","q02CrossSecondAndEpoch","q03LongSupportedRangeAndNegative","q04OffsetAndDstSpringForward","q05DstFallBackAndElapsedDays","q06NullIsUnknownNotZero","q07CutoffTruncationAndRoundTrip","q08ExactFiftyPercentAndOddPlan","q09CompletionEqualityLateAndInvalidPlan","q10ActiveBoundariesAndSeverity","q11DeterministicRandomOracleParity","q12LongPlanThresholdNoOverflow"])
          assert not any(c.find(x) is not None for c in cases for x in ('failure','error','skipped'))
          assert root.attrib['tests']=='12' and all(root.attrib[k]=='0' for k in ('failures','errors','skipped'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm-radar-r01a-postgresql-${{ github.sha }}
          path: target/surefire-reports/TEST-kz.rm.tasks.TaskExactTimingQualificationTest.xml
          if-no-files-found: error
