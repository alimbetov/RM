name: CRM-R2.2 Buyer Link PostgreSQL Qualification
on:
  push:
    branches: [base_dev]
    paths:
      - 'src/main/java/kz/rm/crm/CrmBuyerLinkService.java'
      - 'src/test/java/kz/rm/crm/CrmBuyerLinkQualificationTest.java'
      - 'src/main/resources/db/changelog/db.changelog-master.sql'
      - '.github/workflows/crm-r22-buyer-link-pg.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  buyer-link-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
      - name: Verify exact SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "sha=$GITHUB_SHA" > crm-r22-provenance.txt
          echo "run=$GITHUB_RUN_ID" >> crm-r22-provenance.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Qualify buyer link and CRM regressions on PostgreSQL
        run: mvn -B -ntp -Dtest=CrmBuyerLinkQualificationTest,CrmInteractionQualificationTest,CrmR1aQualificationTest test
      - name: Require all twelve buyer lifecycle tests with no errors or skips
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET,pathlib,json
          files=list(pathlib.Path('target/surefire-reports').glob('TEST-kz.rm.crm.*.xml'))
          expected={'sellerProposalIsIdempotentAndRequiresExplicitBuyerConfirmation',
                    'verifiedBuyerConfirmsOrderAndSellerSeesOnlyTenantOrders',
                    'tenantSeparationAndOneToOneConstraintsPreventSilentIdentityMerge',
                    'archivedCustomerCannotBeLinkedOrExposeOrderHistory',
                    'postgresBuyerLinkEventsCannotBeUpdatedOrDeleted',
                    'postgresConcurrentProposalsPreserveOneCustomerOneBuyer',
                    'postgresConcurrentBuyerConfirmHasOneCommittedEvent',
                    'buyerRevocationStopsHistoryAndAllowsNewExplicitConsent',
                    'disputeFreezesSalesVisibilityAndSellerCanOnlyCloseFailClosed',
                    'sellerReleaseCannotForgeNewBuyerConsentAndHistoryStaysImmutable',
                    'foreignTenantAndStaleRevisionCannotRevokeOrResolve',
                    'postgresOrderedConfirmVersusRevokeAdmitsOneCoherentHistory'}
          assert files,'No CRM Surefire reports'
          cases=[c for f in files for c in ET.parse(f).getroot().iter('testcase')]
          names={c.get('name') for c in cases}
          failures=[c.get('name') for c in cases if c.find('failure') is not None or c.find('error') is not None]
          skipped=[c.get('name') for c in cases if c.find('skipped') is not None]
          result={'executed':len(cases),'failures':failures,'skipped':skipped,'missing':sorted(expected-names)}
          pathlib.Path('crm-r22-summary.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          assert not failures and not skipped and not result['missing']
          PY
      - name: Publish Surefire and exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-r22-buyer-postgresql-${{ github.run_id }}
          path: |
            crm-r22-provenance.txt
            crm-r22-summary.json
            target/surefire-reports/
          if-no-files-found: warn
