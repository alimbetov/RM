name: RM FX R1A Rate Persistence Qualification
on:
  push:
    branches: [base_dev]
    paths:
      - 'src/main/java/kz/rm/fx/**'
      - 'src/test/java/kz/rm/fx/**'
      - 'src/main/resources/db/changelog/db.changelog-master.sql'
      - '.github/workflows/rm-fx-r1a-rate-persistence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fx-r1a-h2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPRING_PROFILES_ACTIVE: dev
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Exact SHA qualification
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run FX R1A on H2
        run: mvn -B -ntp -Dtest=FxRateSnapshotQualificationTest test
      - name: Check executed XML for H2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          f=Path('target/surefire-reports/TEST-kz.rm.fx.FxRateSnapshotQualificationTest.xml')
          assert f.exists()
          cs=list(E.parse(f).getroot().iter('testcase'))
          assert len(cs)==6, len(cs)
          assert sum(c.find('skipped') is not None for c in cs)==1
          assert not any(c.find(x) is not None for c in cs for x in ('error','failure'))
          PY
      - name: Save H2 XML evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-r1a-h2-${{ github.sha }}
          path: target/surefire-reports/TEST-kz.rm.fx.FxRateSnapshotQualificationTest.xml
          if-no-files-found: warn
  fx-r1a-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Exact SHA qualification
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run FX R1A on PostgreSQL
        run: mvn -B -ntp -Dtest=FxRateSnapshotQualificationTest test
      - name: Check all six executed tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          f=Path('target/surefire-reports/TEST-kz.rm.fx.FxRateSnapshotQualificationTest.xml')
          assert f.exists()
          cs=list(E.parse(f).getroot().iter('testcase'))
          assert len(cs)==6, len(cs)
          assert not any(c.find(x) is not None for c in cs for x in ('error','failure','skipped'))
          PY
      - name: Save PostgreSQL XML evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-r1a-postgresql-${{ github.sha }}
          path: target/surefire-reports/TEST-kz.rm.fx.FxRateSnapshotQualificationTest.xml
          if-no-files-found: warn
