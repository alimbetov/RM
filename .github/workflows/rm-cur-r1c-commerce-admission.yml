name: RM CUR-R1C Commerce Admission and PostgreSQL Race
on:
  push:
    branches: [base_dev]
    paths:
      - 'src/main/java/kz/rm/organization/CommerceCurrencyAdmission.java'
      - 'src/main/java/kz/rm/autoorder/AutoOrderService.java'
      - 'src/main/java/kz/rm/storefront/**'
      - 'src/main/java/kz/rm/sales/SalesPriceProposalService.java'
      - 'src/test/java/kz/rm/organization/CommerceCurrencyAdmissionQualificationTest.java'
      - '.github/workflows/rm-cur-r1c-commerce-admission.yml'
      - 'docs/spec/RM-CUR-R1C-COMMERCE-ADMISSION.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cur-r1c-h2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPRING_PROFILES_ACTIVE: dev
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Qualify currency checkout admission H2
        run: mvn -B -ntp -Dtest=CommerceCurrencyAdmissionQualificationTest test
      - name: Assert eleven tests, two PG-only skips
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as E
          from pathlib import Path
          p=Path('target/surefire-reports/TEST-kz.rm.organization.CommerceCurrencyAdmissionQualificationTest.xml')
          assert p.is_file()
          cs=list(E.parse(p).getroot().iter('testcase'))
          assert len(cs)==11,len(cs)
          assert sum(c.find('skipped') is not None for c in cs)==2
          assert not any(c.find(t) is not None for c in cs for t in ('failure','error'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cur-r1c-h2-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: warn
  cur-r1c-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Qualify currency checkout and policy race PostgreSQL
        run: mvn -B -ntp -Dtest=CommerceCurrencyAdmissionQualificationTest test
      - name: Assert eleven PostgreSQL cases without skips
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as E
          from pathlib import Path
          p=Path('target/surefire-reports/TEST-kz.rm.organization.CommerceCurrencyAdmissionQualificationTest.xml')
          assert p.is_file()
          cs=list(E.parse(p).getroot().iter('testcase'))
          assert len(cs)==11,len(cs)
          assert not any(c.find(t) is not None for c in cs for t in ('failure','error','skipped'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cur-r1c-postgresql-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: warn
