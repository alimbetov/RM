name: RM Intelligence Targeted PostgreSQL
on:
  workflow_dispatch:
  push:
    branches: [base_dev, dev/intelligence]
    paths:
      - 'src/main/java/kz/rm/intelligence/**'
      - 'src/main/java/kz/rm/iam/WarehouseStaffScopeService.java'
      - 'src/main/java/kz/rm/iam/TenantAuthorization.java'
      - 'src/main/java/kz/rm/iam/VerifiedActor.java'
      - 'src/main/resources/db/changelog/**'
      - 'src/main/resources/report-templates/**'
      - 'pom.xml'
      - 'src/test/java/kz/rm/intelligence/**'
      - 'src/test/java/kz/rm/iam/L1ProjectionJourneyEvidence.java'
      - 'src/test/java/kz/rm/iam/ConclusionConcurrencyEvidence.java'
      - 'src/test/java/kz/rm/iam/ActivationJourneyEvidence.java'
      - 'src/test/java/kz/rm/iam/BusMvpServiceJourneyQualificationTest.java'
      - 'src/test/java/kz/rm/iam/CanonicalFactJourneyEvidence.java'
      - 'docs/operations/RM-FINAL-SEC-GATE-DB-ROLE-QUALIFICATION.sql'
      - '.github/workflows/rm-intelligence-targeted-pg.yml'
      - '.github/scripts/*rm_intelligence_targeted*'
      - '.github/qualification/rm-intelligence-targeted.json'
permissions:
  contents: read
jobs:
  intelligence-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      # Match Domain Security's constrained pool: the read/revoke fixture must
      # fit in four connections, including its test-owned fence/monitor.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 4
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Isolated development diagnostics only. This is not a release gate,
      # nor a substitute for fresh mandatory qualification on base_dev.
      - name: Validate isolated Intelligence development scope
        if: github.ref == 'refs/heads/dev/intelligence'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args])

          def require(ok, reason):
              if not ok:
                  raise SystemExit(reason)

          head = os.environ["GITHUB_SHA"]
          base = git("rev-parse", "--verify", "refs/remotes/origin/base_dev^{commit}").decode().strip()
          require(re.fullmatch(r"[0-9a-f]{40}", head) and re.fullmatch(r"[0-9a-f]{40}", base), "INVALID_SHA")
          git("merge-base", "--is-ancestor", base, head)
          registry = ".github/qualification/rm-intelligence-targeted.json"
          suites = {
              "DerivedMetricQualificationTest", "DerivedPostgresQualificationTest",
              "BusinessInterpretationQualificationTest", "BusinessTrendQualificationTest",
              "BusinessAnomalyQualificationTest", "BusinessFactorQualificationTest",
              "BusinessConclusionQualificationTest", "AnalyticalJobFoundationQualificationTest",
              "ReportDatasetDigestTest", "ReportStorageQualificationTest"
          }
          tests = {"src/test/java/kz/rm/intelligence/" + s + ".java" for s in suites}
          def validate_diff(base, head):
              raw = git("diff", "--raw", "--no-abbrev", "--no-renames", "-z", base, head, "--")
              records = raw.split(b"\0")
              require(records[-1] == b"" and len(records[:-1]) % 2 == 0, "INVALID_DIFF")
              changed = []
              for header, name in zip(records[:-1:2], records[1:-1:2]):
                  old, new, old_oid, new_oid, status = header.decode("ascii").split()
                  path = name.decode("utf-8", errors="strict")
                  require(new == "100644" and status in ("A", "M")
                          and ((status == "A" and old == ":000000")
                               or (status == "M" and old == ":100644")), "UNSUPPORTED_CHANGE: " + path)
                  source = re.fullmatch(r"src/main/java/kz/rm/intelligence/(?:[A-Za-z0-9_]+/)*[A-Za-z0-9_]+\.java", path)
                  require(bool(source) or (path in tests and status == "M")
                          or (path == registry and status == "M"), "OUT_OF_SCOPE: " + path)
                  changed.append(path)
              require(bool(changed), "NO_DEVELOPMENT_DIFF")
              require(len(changed) == len(set(changed)), "DUPLICATE_PATH")
              if registry in changed:
                  old = json.loads(git("show", base + ":" + registry))
                  new = json.loads(git("show", head + ":" + registry))
                  old_cases = old.pop("requiredCases")
                  new_cases = new.pop("requiredCases")
                  require(old == new and old.get("admission") == "DIAGNOSTIC_ONLY", "REGISTRY_POLICY_DRIFT")
                  def keys(rows):
                      require(all(set(r) == {"classname", "name"} for r in rows), "INVALID_CASE")
                      result = {(r["classname"], r["name"]) for r in rows}
                      require(len(result) == len(rows), "DUPLICATE_CASE")
                      return result
                  before, after = keys(old_cases), keys(new_cases)
                  require(before <= after, "CASE_REMOVAL")
                  require(all(c in {"kz.rm.intelligence." + s for s in suites}
                              and isinstance(n, str) and bool(n) for c, n in after - before), "CASE_OUT_OF_SCOPE")
              return changed

          history = git("rev-list", "--reverse", "--parents", "--max-count=129",
                        base + ".." + head).decode("ascii").splitlines()
          require(0 < len(history) <= 128, "UNSUPPORTED_HISTORY_LENGTH")
          parent = base
          for line in history:
              parts = line.split()
              require(len(parts) == 2 and parts[1] == parent, "NON_LINEAR_HISTORY")
              validate_diff(parent, parts[0])
              parent = parts[0]
          require(parent == head, "HISTORY_HEAD_MISMATCH")
          changed = validate_diff(base, head)
          print(json.dumps({"scope": "INTELLIGENCE_DIAGNOSTIC_ONLY", "baseSha": base,
                            "headSha": head, "changedPaths": sorted(changed),
                            "developmentAdmission": "NOT_GRANTED", "releaseAdmission": "DENIED"}))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify SHA and evidence checker
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s .github/scripts -p 'test_verify_rm_intelligence_targeted.py'
      - name: Execute targeted canonical and L0-L3 journeys
        env:
          RM_TEST_XLSX_EVIDENCE: 'true'
        run: |
          set -euo pipefail
          mvn -B -ntp clean test '-Dtest=BusMvpServiceJourneyQualificationTest#,DerivedMetricQualificationTest,DerivedPostgresQualificationTest,BusinessInterpretationQualificationTest,BusinessTrendQualificationTest,BusinessAnomalyQualificationTest,BusinessFactorQualificationTest,BusinessConclusionQualificationTest,AnalyticalJobFoundationQualificationTest,ReportDatasetDigestTest,ReportStorageQualificationTest'
      - name: Verify exact JUnit evidence
        run: python3 .github/scripts/verify_rm_intelligence_targeted.py --reports target/surefire-reports --registry .github/qualification/rm-intelligence-targeted.json --sha "$GITHUB_SHA" --output rm-intelligence-targeted.json
      - name: Run existing SQL role qualification on populated fixtures
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker cp docs/operations/RM-FINAL-SEC-GATE-DB-ROLE-QUALIFICATION.sql "$PG_SERVICE_ID:/tmp/rm-role-gate.sql"
          docker exec "$PG_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -f /tmp/rm-role-gate.sql | tee rm-intelligence-role-gate.log
      - name: Verify generated XLSX fixture catalog
        shell: bash
        run: |
          set -euo pipefail
          cd target/rm-d06c-fixture-xlsx
          test "$(find . -maxdepth 1 -name 'RM-R*.xlsx' -type f | wc -l)" -eq 12
          test "$(wc -l < SHA256SUMS)" -eq 12
          sha256sum --strict -c SHA256SUMS
      - name: Publish XLSX fixture catalog
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rm-d06c-xlsx-fixture-${{ github.sha }}
          path: target/rm-d06c-fixture-xlsx/
          if-no-files-found: error
      - name: Publish targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm-intelligence-targeted-${{ github.sha }}
          path: |
            target/surefire-reports/
            rm-intelligence-targeted.json
            rm-intelligence-role-gate.log
          if-no-files-found: error
