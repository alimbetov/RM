name: RM Radar R0.1C1 Service Security and Oracle
on:
  push:
    branches: [base_dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radar-c1-h2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPRING_PROFILES_ACTIVE: dev
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: H2 Radar service tests
        run: mvn -B -ntp -Dtest=TaskRadarR01CServiceQualificationTest -Drm.radar.expectedDb=h2 test
      - name: Require eight named H2 cases without skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          p=Path('target/surefire-reports/TEST-kz.rm.tasks.TaskRadarR01CServiceQualificationTest.xml')
          assert p.is_file(),p
          cases=list(E.parse(p).getroot().iter('testcase'))
          assert len(cases)==8,len(cases)
          assert {c.attrib['name'] for c in cases}==set(["c01ExactCutoffAndSeverityThroughService","c02LegacyNullsOverlapUnrelatedAndCompositeTenant","c03ManageOnlyOwnerNullAndMalformedCursorDenied","c04CommittedInactiveAccountMembershipWorkspaceAndPersonalDenied","c05SignedExpiredAndUntrustedBearerRejectedBeforeRadar","c06ReassignmentRemovesOldAssigneeButPreservesCreator","c07RollbackDoesNotChangeVisibleVersionOrHistory","c08IndependentSqlOracleAndWholeTaskLedgerUnchanged"])
          assert not any(c.find(x) is not None for c in cases for x in ('failure','error','skipped'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm-radar-c1-h2-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: error
  radar-c1-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: PostgreSQL Radar service tests
        run: mvn -B -ntp -Dtest=TaskRadarR01CServiceQualificationTest -Drm.radar.expectedDb=postgresql test
      - name: Require eight named PostgreSQL cases without skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          p=Path('target/surefire-reports/TEST-kz.rm.tasks.TaskRadarR01CServiceQualificationTest.xml')
          assert p.is_file(),p
          cases=list(E.parse(p).getroot().iter('testcase'))
          assert len(cases)==8,len(cases)
          assert {c.attrib['name'] for c in cases}==set(["c01ExactCutoffAndSeverityThroughService","c02LegacyNullsOverlapUnrelatedAndCompositeTenant","c03ManageOnlyOwnerNullAndMalformedCursorDenied","c04CommittedInactiveAccountMembershipWorkspaceAndPersonalDenied","c05SignedExpiredAndUntrustedBearerRejectedBeforeRadar","c06ReassignmentRemovesOldAssigneeButPreservesCreator","c07RollbackDoesNotChangeVisibleVersionOrHistory","c08IndependentSqlOracleAndWholeTaskLedgerUnchanged"])
          assert not any(c.find(x) is not None for c in cases
                         for x in ('failure','error','skipped'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm-radar-c1-postgresql-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: error
