name: RM Intelligence A1 PostgreSQL Source Schema
on:
  push:
    branches: [base_dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact SHA and approved contract
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/verify_rm_ie00b_a2_contracts.py
          python3 .github/scripts/verify_rm_ie00b_source_inventory.py
      - name: Qualify migrated schema and pure B1 specifications
        run: mvn -B -ntp clean test '-Dtest=IntelligenceSourceSchemaQualificationTest,IntelligenceB1ContractTest'
      - name: Require executed evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected={'migratedSourceColumnsAndOrderedTenantPrimaryKeys','sourceNumericAndTimestampTypesArePreserved','dstDaysUseCalendarNotFixedSeconds','decadeLeapMonthAndIsoWeekBoundaries','allSevenPeriodsAndVersion','invalidCalendarRejected','registryRejectsWrongSelectionAndVersion','allEightMetricDefinitionsAreExplicit'}
          cases=[c for p in Path('target/surefire-reports').glob('TEST-*.xml') for c in ET.parse(p).getroot().iter('testcase')]
          assert expected <= {c.get('name') for c in cases}
          assert not any(c.find(t) is not None for c in cases for t in ('failure','error','skipped'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm-intelligence-a1-schema-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: warn
