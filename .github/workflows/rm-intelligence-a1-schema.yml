name: RM Intelligence A1 PostgreSQL Source Schema
on:
  push:
    branches: [base_dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact SHA and approved contract
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/verify_rm_ie00b_a2_contracts.py
          python3 .github/scripts/verify_rm_ie00b_source_inventory.py
          python3 .github/scripts/test_verify_rm_kato_directory.py
          python3 .github/scripts/verify_rm_kato_directory.py --admin-manifest src/main/resources/kato-admin-release.json --require-admin-complete --verify-semantic-migration src/main/resources/db/changelog/db.changelog-master.sql
          python3 .github/scripts/test_verify_rm_canonical_producer_inventory.py
          python3 .github/scripts/verify_rm_canonical_producer_inventory.py
      - name: Preflight Maven dependencies 1 (bounded retry)
        shell: bash
        run: |
          set -euo pipefail
          # Compile and resolve dependencies/plugins without running tests or migrating DB.
          # Retry only transient repository/transport failures, never a mutating test.
          for attempt in 1 2 3; do
            log="$(mktemp)"
            if mvn -B -ntp -U -DskipTests test 2>&1 | tee "$log"; then
              rm -f "$log"
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eiq '429 Too Many Requests|status code: (429|502|503|504)|Connection (reset|timed out)|Read timed out' "$log"; then
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
            sleep "$((attempt * 20))"
          done
          exit 1
      - name: Qualify migrated schema and pure B1 specifications
        run: mvn -B -ntp clean test '-Dtest=IntelligenceSourceSchemaQualificationTest,IntelligenceB1ContractTest,CanonicalFactEncodingTest,KatoTerritoryQualificationTest'
      - name: Require executed evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected={'migratedSourceColumnsAndOrderedTenantPrimaryKeys','sourceNumericAndTimestampTypesArePreserved','dstDaysUseCalendarNotFixedSeconds','decadeLeapMonthAndIsoWeekBoundaries','allSevenPeriodsAndVersion','invalidCalendarRejected','registryRejectsWrongSelectionAndVersion','allEightMetricDefinitionsAreExplicit','framingDistinguishesNullEmptyAndDelimiters','decimalScaleIsCanonical','fixedSalesV1V2GoldenVectors','fixedInventoryV1V2GoldenVectors','administrativeReleaseHasTwentyRegionsAndClosedParentChains','semanticTypesAreExplicitAndLocationAdmissionIsNotNumericDepth'}
          cases=[c for p in Path('target/surefire-reports').glob('TEST-*.xml') for c in ET.parse(p).getroot().iter('testcase')]
          assert expected <= {c.get('name') for c in cases}
          assert not any(c.find(t) is not None for c in cases for t in ('failure','error','skipped'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm-intelligence-a1-schema-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: warn

  populated-seal-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Preserve exact-SHA migration probes
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/canonical-seal-evidence"
          cp docs/operations/RM-B2-1R-POPULATED-SEAL-*.sql "$RUNNER_TEMP/canonical-seal-evidence/"
      - name: Checkout pre-0181 owner-source baseline
        uses: actions/checkout@v4
        with:
          ref: 143704fda016df99055f10d355cfe6b3f7d5b9aa
          clean: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Preflight Maven dependencies 2 (bounded retry)
        shell: bash
        run: |
          set -euo pipefail
          # Compile and resolve dependencies/plugins without running tests or migrating DB.
          # Retry only transient repository/transport failures, never a mutating test.
          for attempt in 1 2 3; do
            log="$(mktemp)"
            if mvn -B -ntp -U -DskipTests test 2>&1 | tee "$log"; then
              rm -f "$log"
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eiq '429 Too Many Requests|status code: (429|502|503|504)|Connection (reset|timed out)|Read timed out' "$log"; then
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
            sleep "$((attempt * 20))"
          done
          exit 1
      - name: Populate old schema through real service journey
        run: |
          test "$(git rev-parse HEAD)" = "143704fda016df99055f10d355cfe6b3f7d5b9aa"
          mvn -B -ntp clean test '-Dtest=BusMvpServiceJourneyQualificationTest'
          cp target/surefire-reports/TEST-kz.rm.iam.BusMvpServiceJourneyQualificationTest.xml "$RUNNER_TEMP/canonical-seal-evidence/baseline.xml"
      - name: Seed historical edge cases and capture pre-migration state
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/canonical-seal-evidence"
          docker exec -i "$PG_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U rm -d rm_test < "$p/RM-B2-1R-POPULATED-SEAL-SEED.sql"
          docker exec -i "$PG_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At < "$p/RM-B2-1R-POPULATED-SEAL-SNAPSHOT.sql" > "$p/before.txt"
          test -s "$p/before.txt"
      - name: Checkout and migrate current exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
      - name: Preflight Maven dependencies 3 (bounded retry)
        shell: bash
        run: |
          set -euo pipefail
          # Compile and resolve dependencies/plugins without running tests or migrating DB.
          # Retry only transient repository/transport failures, never a mutating test.
          for attempt in 1 2 3; do
            log="$(mktemp)"
            if mvn -B -ntp -U -DskipTests test 2>&1 | tee "$log"; then
              rm -f "$log"
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eiq '429 Too Many Requests|status code: (429|502|503|504)|Connection (reset|timed out)|Read timed out' "$log"; then
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
            sleep "$((attempt * 20))"
          done
          exit 1
      - name: Apply Liquibase on populated PostgreSQL
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          time mvn -B -ntp clean test '-Dtest=IntelligenceSourceSchemaQualificationTest'
      - name: Require preserved rows and sealed historical snapshots
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/canonical-seal-evidence"
          docker exec -i "$PG_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At < "$p/RM-B2-1R-POPULATED-SEAL-SNAPSHOT.sql" > "$p/after.txt"
          diff -u "$p/before.txt" "$p/after.txt"
          docker exec -i "$PG_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U rm -d rm_test < "$p/RM-B2-1R-POPULATED-SEAL-VERIFY.sql"
          cp target/surefire-reports/TEST-kz.rm.intelligence.IntelligenceSourceSchemaQualificationTest.xml "$p/TEST-kz.rm.intelligence.IntelligenceSourceSchemaQualificationTest.xml"
          python3 - "$p" <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path(sys.argv[1])
          for name, expected in [('baseline.xml',{'busMvpJ1OrganizationEmployeeCustomerTaskSkuOrderStockHistoryPg'}),('TEST-kz.rm.intelligence.IntelligenceSourceSchemaQualificationTest.xml',{'migratedSourceColumnsAndOrderedTenantPrimaryKeys','sourceNumericAndTimestampTypesArePreserved'})]:
              cases=list(ET.parse(p/name).getroot().iter('testcase'))
              assert expected <= {c.get('name') for c in cases}
              assert not any(c.find(tag) is not None for c in cases for tag in ('failure','error','skipped'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm-intelligence-populated-seal-${{ github.sha }}
          path: ${{ runner.temp }}/canonical-seal-evidence/
          if-no-files-found: error
