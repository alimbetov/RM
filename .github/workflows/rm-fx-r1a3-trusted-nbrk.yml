name: RM FX R1A.3 Trusted NBRK Ingestion Qualification
on:
  push:
    branches: [base_dev]
    paths:
      - 'src/main/java/kz/rm/fx/**'
      - 'src/test/java/kz/rm/fx/**'
      - 'src/main/resources/db/changelog/db.changelog-master.sql'
      - '.github/workflows/rm-fx-r1a3-trusted-nbrk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-nbrk-h2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPRING_PROFILES_ACTIVE: dev
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Execute H2 and offline parser qualification
        run: mvn -B -ntp -Dtest=TrustedNbrkIngestionQualificationTest,NbrkRssXmlParserQualificationTest,FxRateSnapshotQualificationTest test
      - name: Validate exact case counts and H2 expected PG-only skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = {
            'TrustedNbrkIngestionQualificationTest': (15,1),
            'NbrkRssXmlParserQualificationTest': (8,0),
            'FxRateSnapshotQualificationTest': (6,1),
          }
          for name,(count,skips) in cases.items():
            files=list(Path('target/surefire-reports').glob(f'TEST-*{name}.xml'))
            assert len(files)==1,files
            all_cases=list(ET.parse(files[0]).getroot().iter('testcase'))
            assert len(all_cases)==count,(name,len(all_cases))
            assert sum(c.find('skipped') is not None for c in all_cases)==skips,name
            assert not any(c.find(x) is not None for c in all_cases for x in ('failure','error')),name
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fx-r1a3-h2-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: warn

  trusted-nbrk-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Execute PostgreSQL immutable and concurrent qualifications
        run: mvn -B -ntp -Dtest=TrustedNbrkIngestionQualificationTest,NbrkRssXmlParserQualificationTest,FxRateSnapshotQualificationTest test
      - name: Require 29 executed cases (no skips)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name,count in [('TrustedNbrkIngestionQualificationTest',15),
                             ('NbrkRssXmlParserQualificationTest',8),
                             ('FxRateSnapshotQualificationTest',6)]:
            files=list(Path('target/surefire-reports').glob(f'TEST-*{name}.xml'))
            assert len(files)==1,files
            cases=list(ET.parse(files[0]).getroot().iter('testcase'))
            assert len(cases)==count,(name,len(cases))
            assert not any(c.find(x) is not None for c in cases
                           for x in ('skipped','failure','error')),name
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fx-r1a3-postgresql-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: warn
