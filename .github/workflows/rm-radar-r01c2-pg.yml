name: RM Radar R0.1C2 PostgreSQL Concurrency
on:
  push:
    branches: [base_dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:

  radar-c2-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: PostgreSQL Radar service tests
        run: mvn -B -ntp -Dtest=TaskRadarPgConcurrencyQualificationTest -Drm.radar.c2.expectedDb=postgresql test
      - name: Require eleven named PostgreSQL cases without skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          p=Path('target/surefire-reports/TEST-kz.rm.tasks.TaskRadarPgConcurrencyQualificationTest.xml')
          assert p.is_file(),p
          cases=list(E.parse(p).getroot().iter('testcase'))
          assert len(cases)==11,len(cases)
          assert {c.attrib['name'] for c in cases}==set(["c201RoleRevocationBothCommitOrders","c202AccountSuspensionBothCommitOrders","c203MembershipSuspensionBothCommitOrders","c204WorkspaceSuspensionBothCommitOrders","c205CompletionBothOrdersNoTaskLock","c206CancellationBothOrdersNoTaskLock","c207RescheduleBothOrdersNoTaskLock","c208ReassignmentBothOrdersNoTaskLock","c209RequeueBothOrdersNoTaskLock","c210RollbackStatusAndDeadlineWhileReadCommits","c211LiveKeysetRefreshAfterCommittedMutation"])
          assert not any(c.find(x) is not None for c in cases
                         for x in ('failure','error','skipped'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm-radar-c2-postgresql-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: error
