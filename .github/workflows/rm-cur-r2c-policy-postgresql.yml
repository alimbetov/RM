name: RM CUR-R2C Policy Schema PostgreSQL Qualification
on:
  push:
    branches: [base_dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cur-r2c-policy-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Exact-SHA checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: PostgreSQL schema and isolated simulation tests
        run: mvn -B -ntp -Dtest=FxAutoPolicySchemaPgTest,FxAutoRollingLimitEvaluatorTest,FxAutoDryRunTest,FxAutoOwnerAdmissionQualificationTest,TenantCurrencyPolicyQualificationTest,SkuFxSellerApprovalQualificationTest test
      - name: Qualify synthetic non-owner PostgreSQL runtime role
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d rm_test < docs/operations/RM-CUR-R2C-DB-ROLE-QUALIFICATION.sql
      - name: Require exact executed cases without skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          for name, expected in [('FxAutoPolicySchemaPgTest',8),('FxAutoRollingLimitEvaluatorTest',8),('FxAutoDryRunTest',6),('FxAutoOwnerAdmissionQualificationTest',17)]:
              p=Path('target/surefire-reports/TEST-kz.rm.fx.auto.'+name+'.xml')
              cases=list(E.parse(p).getroot().iter('testcase'))
              assert len(cases)==expected,(name,len(cases))
              assert not any(c.find(x) is not None for c in cases for x in ('skipped','error','failure')),name
          for package,name,expected in [('organization','TenantCurrencyPolicyQualificationTest',14),('fx','SkuFxSellerApprovalQualificationTest',35)]:
              p=Path('target/surefire-reports/TEST-kz.rm.'+package+'.'+name+'.xml')
              cases=list(E.parse(p).getroot().iter('testcase'))
              assert len(cases)==expected,(name,len(cases))
              assert not any(c.find(x) is not None for c in cases for x in ('skipped','error','failure')),name
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cur-r2c-policy-pg-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: error

  cur-r2c-populated-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bec36b306e1f5627bffa8b93f31434357a1b8e36
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Populate pre-0154 canonical FX and sales history
        run: mvn -B -ntp -Dtest=SkuFxSellerApprovalQualificationTest test
      - name: Capture historical rows
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -c "SELECT to_regclass('crm.fx_auto_policy_revision') IS NULL" | grep -Fx t
          for t in sku_fx_policy_version sku_fx_guardrail_version sku_fx_calculation sku_fx_seller_decision store_offer_price_revision fx_official_rate_snapshot; do
            docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -c "SELECT to_jsonb(x)::text FROM crm.$t x ORDER BY 1" > "/tmp/fx-before-$t"
          done
          test -s /tmp/fx-before-sku_fx_policy_version
          test -s /tmp/fx-before-store_offer_price_revision
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
      - name: Upgrade and qualify on exact SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mvn -B -ntp -Dtest=FxAutoPolicySchemaPgTest test
      - name: Verify canonical history and repeat Liquibase startup
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for t in sku_fx_policy_version sku_fx_guardrail_version sku_fx_calculation sku_fx_seller_decision store_offer_price_revision fx_official_rate_snapshot; do
            docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -c "SELECT to_jsonb(x)::text FROM crm.$t x ORDER BY 1" > "/tmp/fx-after-$t"
            LC_ALL=C sort "/tmp/fx-before-$t" > "/tmp/fx-before-$t.sorted"
            LC_ALL=C sort "/tmp/fx-after-$t" > "/tmp/fx-after-$t.sorted"
            comm -23 "/tmp/fx-before-$t.sorted" "/tmp/fx-after-$t.sorted" > "/tmp/fx-missing-$t"
            test ! -s "/tmp/fx-missing-$t"
          done
          docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -c "SELECT id||'|'||md5sum FROM databasechangelog ORDER BY orderexecuted" > /tmp/fx-changelog-before
          mvn -B -ntp -Dtest=FxAutoPolicySchemaPgTest test
          docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -c "SELECT id||'|'||md5sum FROM databasechangelog ORDER BY orderexecuted" > /tmp/fx-changelog-after
          diff -u /tmp/fx-changelog-before /tmp/fx-changelog-after
      - name: Backup restore and recompute evidence
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" pg_dump -U rm -Fc rm_test -f /tmp/fx.dump
          docker exec "$PG_CONTAINER" createdb -U rm rm_restore
          docker exec "$PG_CONTAINER" pg_restore -U rm -d rm_restore --exit-on-error /tmp/fx.dump
          for db in rm_test rm_restore; do
            docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d "$db" -At -c "
              SELECT count(*) FROM crm.fx_auto_approval_evidence WHERE scope_sha256 IS NULL OR trim(scope_sha256) IS DISTINCT FROM crm.fx_auto_scope_sha_v1(tenant_id,policy_revision_id)" | grep -Fx 0
            docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d "$db" -At -c "
              SELECT count(*) FROM crm.fx_auto_simulation_seal WHERE trim(result_sha256) IS DISTINCT FROM crm.fx_auto_sim_sha_v1(tenant_id,simulation_id)" | grep -Fx 0
            docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d "$db" -At -c "
              SELECT tenant_id||'/'||id||'/'||scope_sha256 FROM crm.fx_auto_approval_evidence ORDER BY 1" > "/tmp/fx-$db-approval"
            docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d "$db" -At -c "
              SELECT tenant_id||'/'||simulation_id||'/'||result_sha256 FROM crm.fx_auto_simulation_seal ORDER BY 1" > "/tmp/fx-$db-seal"
          done
          test -s /tmp/fx-rm_test-approval
          test -s /tmp/fx-rm_test-seal
          diff -u /tmp/fx-rm_test-approval /tmp/fx-rm_restore-approval
          diff -u /tmp/fx-rm_test-seal /tmp/fx-rm_restore-seal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cur-r2c-populated-pg-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: error

  cur-r2c-anchor-populated-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e58b147aa23e8541f2759ba3b226eaa61d9b4c91
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Populate exact pre-0160 currency and legacy FX history
        run: mvn -B -ntp -Dtest=TenantCurrencyPolicyQualificationTest,SkuFxSellerApprovalQualificationTest test
      - name: Capture legacy currency permissions and events
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for t in tenant_currency_policy tenant_allowed_currency tenant_currency_policy_event; do
            docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -c "SELECT to_jsonb(x)::text FROM public.$t x ORDER BY 1" | LC_ALL=C sort > "/tmp/anchor-before-$t"
            test -s "/tmp/anchor-before-$t"
          done
          docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -c "SELECT count(*) FROM public.tenant_allowed_currency WHERE purpose='PRICING_ANCHOR'" | grep -Fx 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
      - name: Upgrade and run current currency and legacy FX qualification
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mvn -B -ntp -Dtest=TenantCurrencyPolicyQualificationTest,SkuFxSellerApprovalQualificationTest test
      - name: Verify preserved rows and no implicit anchor backfill
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for t in tenant_currency_policy tenant_allowed_currency tenant_currency_policy_event; do
            docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -c "SELECT to_jsonb(x)::text FROM public.$t x ORDER BY 1" | LC_ALL=C sort > "/tmp/anchor-after-$t"
            LC_ALL=C comm -23 "/tmp/anchor-before-$t" "/tmp/anchor-after-$t" > "/tmp/anchor-missing-$t"
            test ! -s "/tmp/anchor-missing-$t"
          done
          docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -c "SELECT count(*) FROM public.tenant_allowed_currency a WHERE a.purpose='PRICING_ANCHOR' AND NOT EXISTS(SELECT 1 FROM public.tenant_currency_policy_event e WHERE e.tenant_id=a.tenant_id AND e.currency_code=a.currency_code AND e.purpose=a.purpose AND e.action_code='CURRENCY_ENABLED')" | grep -Fx 0
          docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U rm -d rm_test -At -c "SELECT count(*) FROM databasechangelog WHERE id='0160-cur-r2c-pricing-anchor-purpose'" | grep -Fx 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cur-r2c-anchor-populated-pg-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: error
