name: RM FC-40 Order Execution PostgreSQL Qualification

on:
  push:
    branches: [base_dev]
    paths:
      - 'src/main/java/kz/rm/sales/SalesInventoryCommandService.java'
      - 'src/main/java/kz/rm/autoorder/AutoOrderService.java'
      - 'src/test/java/kz/rm/autoorder/PublishedQrCheckoutQualificationTest.java'
      - 'src/test/java/kz/rm/sales/QrNegotiatedCheckoutQualificationTest.java'
      - 'src/test/java/kz/rm/sales/SalesInventoryRbacQualificationTest.java'
      - 'src/main/resources/db/changelog/db.changelog-master.sql'
      - '.github/workflows/rm-fc40-order-execution-pg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fc40-picked-order-fences:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: test
      RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
      RM_TEST_DB_USERNAME: rm
      RM_TEST_DB_PASSWORD: rm_ci_only
      RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify FC-40 lifecycle, QR provenance and immutable channel admission
        run: |
          set -o pipefail
          mkdir -p target/fc40-evidence
          mvn -B -ntp '-Dtest=SalesInventoryRbacQualificationTest#fc40PickedOrderCannotCancelAndReservationStaysIntact+decFul01PickupProofRequiredBlocksGenericFulfillBeforePreparing,PublishedQrCheckoutQualificationTest,QrNegotiatedCheckoutQualificationTest' test 2>&1 | tee target/fc40-evidence/console.log
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('target/surefire-reports')
          paths=list(root.glob('TEST-*.xml'))
          assert paths, 'FC40_MISSING_SUREFIRE_XML'
          cases=[c for p in paths for c in ET.parse(p).getroot().iter('testcase')]
          required={'fc40PickedOrderCannotCancelAndReservationStaysIntact',
                    'decFul01PickupProofRequiredBlocksGenericFulfillBeforePreparing',
                    'decFul01QrCheckoutPersistsPickupProofRequiredBeforePreparation',
                    'decFul01RegularCheckoutRetainsHistoricalStandardChannel',
                    'decFul01PostgresRejectsDowngradingQrOrderFulfillmentMode',
                    'qr04bAcceptedPriceCreatesOnePlacedOrderWithImmutableQuoteSource'}
          names={c.get('name') for c in cases}
          assert required <= names, 'FC40_MISSING_CASES: '+str(sorted(required-names))
          assert not any(c.find(k) is not None for c in cases
                         for k in ('error','failure','skipped')), 'FC40_SUREFIRE_NOT_GREEN'
          assert len(cases)>=6, 'FC40_TOO_FEW_TESTS'
          PY
          printf '%s\n' "$GITHUB_SHA" > target/fc40-evidence/exact-sha.txt
      - name: Preserve FC40 PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc40-order-execution-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/fc40-evidence/
          if-no-files-found: warn
