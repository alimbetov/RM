name: RM QR-07 R0 Return Foundation PostgreSQL Qualification

on:
  push:
    branches: [base_dev]
    paths:
      - 'src/main/java/kz/rm/sales/SalesReturn*.java'
      - 'src/main/java/kz/rm/iam/DomainPermission.java'
      - 'src/main/resources/db/changelog/db.changelog-master.sql'
      - 'src/test/java/kz/rm/sales/QrWarehouseHandoverQualificationTest.java'
      - '.github/workflows/rm-qr07-r0-pg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qr07-r0-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact SHA for QR-07
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Qualify R0 migration and buyer return service on real PostgreSQL
        env:
          SPRING_PROFILES_ACTIVE: test
          RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
          RM_TEST_DB_USERNAME: rm
          RM_TEST_DB_PASSWORD: rm_ci_only
          RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
        run: |
          mkdir -p target/qr07-r0-evidence
          set -o pipefail
          mvn -B -ntp '-Dtest=QrWarehouseHandoverQualificationTest#qr07R0*' test 2>&1 | tee target/qr07-r0-evidence/console.log
          printf '%s\n' "${GITHUB_SHA}" > target/qr07-r0-evidence/exact-sha.txt
      - name: Preserve migration and service test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr07-r0-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/qr07-r0-evidence/
          if-no-files-found: error
