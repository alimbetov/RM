name: RM QR-07 R0-R2 Physical Return PostgreSQL Qualification

on:
  push:
    branches: [base_dev]
    paths:
      - 'src/main/java/kz/rm/sales/SalesReturn*.java'
      - 'src/main/java/kz/rm/inventory/ReturnInventoryPostingPort.java'
      - 'src/test/java/kz/rm/sales/QrReturnProcessWorker.java'
      - 'src/test/java/kz/rm/iam/SignedJwtTestAuthority.java'
      - 'src/test/java/kz/rm/iam/OidcTestDecoderSupport.java'
      - 'src/main/java/kz/rm/iam/OidcJwtConfiguration.java'
      - 'src/main/java/kz/rm/iam/OidcActorResolver.java'
      - 'src/main/java/kz/rm/iam/VerifiedActor.java'
      - 'src/main/java/kz/rm/iam/DomainPermission.java'
      - 'src/main/java/kz/rm/iam/TenantAuthorization.java'
      - 'src/main/resources/db/changelog/db.changelog-master.sql'
      - 'src/test/java/kz/rm/sales/QrWarehouseHandoverQualificationTest.java'
      - '.github/scripts/verify_ret04_evidence.py'
      - '.github/scripts/test_verify_ret04_evidence.py'
      - '.github/scripts/verify_ret04_identity_e3a.py'
      - '.github/scripts/test_verify_ret04_identity_e3a.py'
      - '.github/scripts/verify_ret04_revocation_e3b.py'
      - '.github/scripts/test_verify_ret04_revocation_e3b.py'
      - 'src/test/java/kz/rm/sales/PgCommitOrderEvidence.java'
      - 'src/main/java/kz/rm/iam/GlobalAccountStatusService.java'
      - 'src/main/java/kz/rm/iam/TenantAccessStatusService.java'
      - 'src/main/java/kz/rm/iam/TenantRoleService.java'
      - 'src/main/java/kz/rm/iam/VerifiedTenantRoleCommands.java'
      - 'src/main/java/kz/rm/iam/WarehouseStaffScopeService.java'
      - 'docs/spec/RM-MVP-CORE-P0-SERVICE-EVIDENCE-v1.json'
      - '.github/workflows/rm-qr07-r0-pg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qr07-r0-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact SHA for QR-07
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Qualify R0-R2 return lifecycle and atomic stock posting on PostgreSQL
        env:
          SPRING_PROFILES_ACTIVE: test
          RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
          RM_TEST_DB_USERNAME: rm
          RM_TEST_DB_PASSWORD: rm_ci_only
          RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
        run: |
          mkdir -p target/qr07-r0-evidence
          export RM_RET04_EVIDENCE_DIR="$PWD/target/qr07-r0-evidence/sql"
          set -o pipefail
          mvn -B -ntp dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile=target/qr07-classpath.txt
          export RM_QR06B_JAVA_CLASSPATH="$PWD/target/test-classes:$PWD/target/classes:$(cat target/qr07-classpath.txt)"
          mvn -B -ntp '-Dtest=QrWarehouseHandoverQualificationTest#qr07R*' test 2>&1 | tee target/qr07-r0-evidence/console.log
          printf '%s\n' "${GITHUB_SHA}" > target/qr07-r0-evidence/exact-sha.txt
      - name: Verify RET04 exact-SHA SQL and testcase evidence
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_verify_ret04_evidence.py' -v
          python3 .github/scripts/verify_ret04_evidence.py --evidence target/qr07-r0-evidence --xml target/surefire-reports/TEST-kz.rm.sales.QrWarehouseHandoverQualificationTest.xml
      - name: Verify E3A strict identity and RBAC evidence
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_verify_ret04_identity_e3a.py' -v
          python3 .github/scripts/verify_ret04_identity_e3a.py --evidence target/qr07-r0-evidence --xml target/surefire-reports/TEST-kz.rm.sales.QrWarehouseHandoverQualificationTest.xml
      - name: Verify E3B concurrent revocation evidence
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_verify_ret04_revocation_e3b.py' -v
          python3 .github/scripts/verify_ret04_revocation_e3b.py --evidence target/qr07-r0-evidence --xml target/surefire-reports/TEST-kz.rm.sales.QrWarehouseHandoverQualificationTest.xml
      - name: Preserve migration and service test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr07-r0-r1-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/qr07-r0-evidence/
          if-no-files-found: error

  qr07-full-postgresql-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm_ci_only
          POSTGRES_DB: rm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact full PostgreSQL SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: All Maven service tests against PostgreSQL 17
        env:
          # Bound cached Spring contexts; child JVM load pools retain their own settings.
          JAVA_TOOL_OPTIONS: '-Dspring.test.context.cache.maxSize=4'
          SPRING_PROFILES_ACTIVE: test
          RM_TEST_DB_URL: jdbc:postgresql://localhost:5432/rm_test
          RM_TEST_DB_USERNAME: rm
          RM_TEST_DB_PASSWORD: rm_ci_only
          RM_KMS_ROOT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RM_IAM_EMAIL_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RM_IAM_EMAIL_LOOKUP_KEY_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
        run: |
          mkdir -p target/qr07-full-pg
          set -o pipefail
          mvn -B -ntp dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile=target/qr07-classpath.txt
          export RM_QR06B_JAVA_CLASSPATH="$PWD/target/test-classes:$PWD/target/classes:$(cat target/qr07-classpath.txt)"
          timeout --signal=TERM --kill-after=30s 2700s mvn -B -ntp test 2>&1 | tee target/qr07-full-pg/console.log
          printf '%s\n' "$GITHUB_SHA" > target/qr07-full-pg/exact-sha.txt
      - name: Preserve full PostgreSQL Surefire and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr07-full-pg-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/qr07-full-pg/
          if-no-files-found: warn
