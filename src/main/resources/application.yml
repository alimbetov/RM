spring:
  application:
    name: rm
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.sql

server:
  port: ${SERVER_PORT:8080}

# Nightly audit history retention: deliberately opt-in until tenant approvals and
# PostgreSQL upgrade/backup qualification are complete.
rm:
  files:
    # Deployment-time switch: false = LOCAL writes; true = RustFS writes.
    # Existing blobs keep their provider; never silently migrate on flip.
    rustfs:
      enabled: ${RM_FILES_RUSTFS_ENABLED:false}
      # Endpoint only provided by the operator; no implicit local S3 connection.
      # endpoint: ${RM_FILES_RUSTFS_ENDPOINT}
      region: ${RM_FILES_RUSTFS_REGION:us-east-1}
      bucket: ${RM_FILES_RUSTFS_BUCKET:rm-files}
      access-key: ${RM_FILES_RUSTFS_ACCESS_KEY:}
      secret-key: ${RM_FILES_RUSTFS_SECRET_KEY:}
    encrypted-local:
      enabled: false
  retention:
    enabled: ${RM_RETENTION_ENABLED:false}
    cron: "${RM_RETENTION_CRON:0 30 2 * * *}"
    time-zone: "${RM_RETENTION_TIME_ZONE:Asia/Almaty}"
    batch-size: ${RM_RETENTION_BATCH_SIZE:500}
    max-batches: ${RM_RETENTION_MAX_BATCHES:10}

# First global administrator: off by default, operator-only. Keep the 256-bit
# setup secret out of files/logs; only SHA-256 hex is exposed as configuration.
  iam:
    pii:
      migration:
        enabled: ${RM_IAM_PII_MIGRATION_ENABLED:false}
    bootstrap:
      enabled: ${RM_IAM_BOOTSTRAP_ENABLED:false}
      token-sha256: "${RM_IAM_BOOTSTRAP_TOKEN_SHA256:}"
