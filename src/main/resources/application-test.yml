spring:
  datasource:
    url: ${RM_TEST_DB_URL:jdbc:postgresql://localhost:5432/rm_test}
    username: ${RM_TEST_DB_USERNAME:rm}
    password: ${RM_TEST_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false
